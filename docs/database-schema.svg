<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="auto" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="820" rx="12" fill="#0b1120" />

  <!-- Title -->
  <text x="40" y="34" fill="#f8fafc" font-size="18" font-weight="700">PostgreSQL 19 — Entity-Relationship Diagram (dump v2)</text>
  <text x="40" y="54" fill="#94a3b8" font-size="12">Pure storage + native ENUM (question_type) + Covering &amp; Partial Indexes</text>

  <!-- Connectors -->
  <!-- exams -> topics -->
  <path d="M 320 135 L 390 135" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="338" y="126" fill="#7dd3fc" font-size="11" font-weight="600">1:N</text>

  <!-- exams -> case_studies -->
  <path d="M 320 235 L 355 235 L 355 320 L 390 320" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="330" y="290" fill="#7dd3fc" font-size="11" font-weight="600">1:N</text>

  <!-- topics -> questions -->
  <path d="M 670 135 L 760 135" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="698" y="126" fill="#7dd3fc" font-size="11" font-weight="600">1:N</text>

  <!-- case_studies -> questions -->
  <path d="M 670 320 L 715 320 L 715 240 L 760 240" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="680" y="308" fill="#7dd3fc" font-size="11" font-weight="600">1:N (opt)</text>

  <!-- exams -> client_exam_progress -->
  <path d="M 180 285 L 180 430" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="190" y="365" fill="#7dd3fc" font-size="11" font-weight="600">1:N (exam_id)</text>

  <!-- clients -> client_exam_progress -->
  <path d="M 180 615 L 180 575" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />
  <text x="190" y="600" fill="#c4b5fd" font-size="11" font-weight="600">1:N (CASCADE)</text>

  <!-- clients -> client_answers -->
  <path d="M 320 680 L 390 680 L 390 560 L 420 560" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />

  <!-- clients -> client_question_flags -->
  <path d="M 320 715 L 880 715 L 880 680" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />
  <text x="535" y="707" fill="#c4b5fd" font-size="11" font-weight="600">clients.id TEXT (ON UPDATE CASCADE)</text>

  <!-- questions -> client_answers -->
  <path d="M 760 400 L 730 400 L 730 510 L 710 510" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- questions -> client_question_flags -->
  <path d="M 960 450 L 960 495" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="970" y="478" fill="#7dd3fc" font-size="11" font-weight="600">1:N</text>

