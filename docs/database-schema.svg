<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="100%" height="auto" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="700" rx="12" fill="#0b1120" />

  <!-- Title -->
  <text x="40" y="34" fill="#f8fafc" font-size="18" font-weight="700">PostgreSQL 19 — Entity-Relationship Diagram (dump)</text>

  <!-- Relationship Connectors -->
  <!-- exams -> topics -->
  <path d="M 330 115 L 410 115" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="352" y="106" fill="#7dd3fc" font-size="11" font-weight="600">1 : N</text>

  <!-- topics -> questions -->
  <path d="M 700 115 L 780 115" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="722" y="106" fill="#7dd3fc" font-size="11" font-weight="600">1 : N</text>

  <!-- exams -> client_exam_progress -->
  <path d="M 185 280 L 185 385" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="195" y="338" fill="#7dd3fc" font-size="11" font-weight="600">1 : N (exam_id)</text>

  <!-- questions -> client_answers -->
  <path d="M 780 430 L 750 430 L 750 475 L 720 475" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="585" y="625" fill="#7dd3fc" font-size="11" font-weight="600">FK: (exam_id, question_id) → questions(exam_id, id)</text>
  <path d="M 930 465 L 930 605 L 565 605 L 565 595" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,4" fill="none" />

  <!-- TABLE: exams -->
  <g transform="translate(40, 55)">
    <rect width="290" height="225" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect width="290" height="34" rx="8" fill="#1e3a8a" />
    <rect y="24" width="290" height="10" fill="#1e3a8a" />
    <text x="14" y="22" fill="#ffffff" font-size="14" font-weight="700">exams</text>

    <text x="14" y="56" fill="#fbbf24" font-size="11" font-weight="700">PK</text>
    <text x="42" y="56" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="205" y="56" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="42" y="78" fill="#cbd5e1" font-size="12">code</text>
    <text x="205" y="78" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="42" y="100" fill="#cbd5e1" font-size="12">title</text>
    <text x="205" y="100" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="42" y="122" fill="#cbd5e1" font-size="12">vendor</text>
    <text x="205" y="122" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="42" y="144" fill="#cbd5e1" font-size="12">description</text>
    <text x="205" y="144" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="42" y="166" fill="#cbd5e1" font-size="12">description_vi</text>
    <text x="205" y="166" fill="#94a3b8" font-size="11">TEXT (null)</text>

    <text x="42" y="188" fill="#cbd5e1" font-size="12">updated_at</text>
    <text x="205" y="188" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>

    <text x="42" y="210" fill="#cbd5e1" font-size="12">created_at</text>
    <text x="205" y="210" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
  </g>

  <!-- TABLE: topics -->
  <g transform="translate(410, 55)">
    <rect width="290" height="160" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect width="290" height="34" rx="8" fill="#1e3a8a" />
    <rect y="24" width="290" height="10" fill="#1e3a8a" />
    <text x="14" y="22" fill="#ffffff" font-size="14" font-weight="700">topics</text>

    <text x="12" y="56" fill="#fbbf24" font-size="10" font-weight="700">PK,FK</text>
    <text x="50" y="56" fill="#f1f5f9" font-size="12" font-weight="600">exam_id</text>
    <text x="205" y="56" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="14" y="78" fill="#fbbf24" font-size="11" font-weight="700">PK</text>
    <text x="50" y="78" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="205" y="78" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="50" y="100" fill="#cbd5e1" font-size="12">name</text>
    <text x="205" y="100" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="50" y="122" fill="#cbd5e1" font-size="12">name_vi</text>
    <text x="205" y="122" fill="#94a3b8" font-size="11">TEXT (null)</text>

    <text x="50" y="144" fill="#cbd5e1" font-size="12">sort_order</text>
    <text x="205" y="144" fill="#94a3b8" font-size="11">INTEGER</text>
  </g>

  <!-- TABLE: questions -->
  <g transform="translate(780, 55)">
    <rect width="300" height="410" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect width="300" height="34" rx="8" fill="#1e3a8a" />
    <rect y="24" width="300" height="10" fill="#1e3a8a" />
    <text x="14" y="22" fill="#ffffff" font-size="14" font-weight="700">questions</text>

    <text x="14" y="56" fill="#fbbf24" font-size="11" font-weight="700">PK</text>
    <text x="50" y="56" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="210" y="56" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="12" y="78" fill="#38bdf8" font-size="10" font-weight="700">FK,UQ</text>
    <text x="50" y="78" fill="#cbd5e1" font-size="12">exam_id</text>
    <text x="210" y="78" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="14" y="100" fill="#38bdf8" font-size="11" font-weight="700">FK</text>
    <text x="50" y="100" fill="#cbd5e1" font-size="12">topic_id</text>
    <text x="210" y="100" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="14" y="122" fill="#a78bfa" font-size="11" font-weight="700">UQ</text>
    <text x="50" y="122" fill="#cbd5e1" font-size="12">question_index</text>
    <text x="210" y="122" fill="#94a3b8" font-size="11">INTEGER</text>

    <text x="50" y="144" fill="#cbd5e1" font-size="12">prompt</text>
    <text x="210" y="144" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="50" y="166" fill="#cbd5e1" font-size="12">prompt_vi</text>
    <text x="210" y="166" fill="#94a3b8" font-size="11">TEXT (null)</text>

    <text x="50" y="188" fill="#cbd5e1" font-size="12">multiple_choice</text>
    <text x="210" y="188" fill="#94a3b8" font-size="11">BOOLEAN</text>

    <text x="50" y="210" fill="#cbd5e1" font-size="12">show_answer_by_default</text>
    <text x="210" y="210" fill="#94a3b8" font-size="11">BOOLEAN</text>

    <text x="50" y="232" fill="#34d399" font-size="12">options</text>
    <text x="210" y="232" fill="#34d399" font-size="11">JSONB</text>

    <text x="50" y="254" fill="#cbd5e1" font-size="12">correct_option_ids</text>
    <text x="210" y="254" fill="#94a3b8" font-size="11">TEXT[]</text>

    <text x="50" y="276" fill="#cbd5e1" font-size="12">explanation</text>
    <text x="210" y="276" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="50" y="298" fill="#cbd5e1" font-size="12">explanation_vi</text>
    <text x="210" y="298" fill="#94a3b8" font-size="11">TEXT (null)</text>

    <text x="50" y="320" fill="#cbd5e1" font-size="12">keywords</text>
    <text x="210" y="320" fill="#94a3b8" font-size="11">TEXT[]</text>

    <text x="50" y="342" fill="#cbd5e1" font-size="12">keywords_vi</text>
    <text x="210" y="342" fill="#94a3b8" font-size="11">TEXT[]</text>

    <text x="50" y="364" fill="#34d399" font-size="12">images</text>
    <text x="210" y="364" fill="#34d399" font-size="11">JSONB</text>

    <text x="14" y="392" fill="#64748b" font-size="10">UNIQUE (exam_id, id) · UNIQUE (exam_id, question_index)</text>
  </g>

  <!-- TABLE: client_exam_progress -->
  <g transform="translate(40, 385)">
    <rect width="310" height="145" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect width="310" height="34" rx="8" fill="#0f766e" />
    <rect y="24" width="310" height="10" fill="#0f766e" />
    <text x="14" y="22" fill="#ffffff" font-size="14" font-weight="700">client_exam_progress</text>

    <text x="14" y="56" fill="#fbbf24" font-size="11" font-weight="700">PK,FK</text>
    <text x="58" y="56" fill="#f1f5f9" font-size="12" font-weight="600">client_id</text>
    <text x="210" y="56" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="12" y="78" fill="#fbbf24" font-size="10" font-weight="700">PK,FK</text>
    <text x="52" y="78" fill="#f1f5f9" font-size="12" font-weight="600">exam_id</text>
    <text x="210" y="78" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="52" y="100" fill="#cbd5e1" font-size="12">last_question_index</text>
    <text x="210" y="100" fill="#94a3b8" font-size="11">INTEGER (null)</text>

    <text x="52" y="122" fill="#cbd5e1" font-size="12">updated_at</text>
    <text x="210" y="122" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
  </g>

  <!-- TABLE: client_answers -->
  <g transform="translate(410, 385)">
    <rect width="310" height="210" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <rect width="310" height="34" rx="8" fill="#0f766e" />
    <rect y="24" width="310" height="10" fill="#0f766e" />
    <text x="14" y="22" fill="#ffffff" font-size="14" font-weight="700">client_answers</text>

    <text x="14" y="56" fill="#fbbf24" font-size="11" font-weight="700">PK,FK</text>
    <text x="58" y="56" fill="#f1f5f9" font-size="12" font-weight="600">client_id</text>
    <text x="215" y="56" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="12" y="78" fill="#fbbf24" font-size="10" font-weight="700">PK,FK</text>
    <text x="52" y="78" fill="#f1f5f9" font-size="12" font-weight="600">question_id</text>
    <text x="215" y="78" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="14" y="100" fill="#38bdf8" font-size="11" font-weight="700">FK</text>
    <text x="52" y="100" fill="#cbd5e1" font-size="12">exam_id</text>
    <text x="215" y="100" fill="#94a3b8" font-size="11">TEXT</text>

    <text x="52" y="122" fill="#cbd5e1" font-size="12">question_index</text>
    <text x="215" y="122" fill="#94a3b8" font-size="11">INTEGER</text>

    <text x="52" y="144" fill="#cbd5e1" font-size="12">selected_option_ids</text>
    <text x="215" y="144" fill="#94a3b8" font-size="11">TEXT[]</text>

    <text x="52" y="166" fill="#cbd5e1" font-size="12">is_correct</text>
    <text x="215" y="166" fill="#94a3b8" font-size="11">BOOLEAN</text>

    <text x="52" y="188" fill="#cbd5e1" font-size="12">answered_at</text>
    <text x="215" y="188" fill="#94a3b8" font-size="11">TIMESTAMPTZ</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 565)">
    <rect width="310" height="82" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" font-size="11" font-weight="700">LEGEND</text>
    <text x="14" y="44" fill="#fbbf24" font-size="11" font-weight="700">PK</text>
    <text x="38" y="44" fill="#cbd5e1" font-size="11">Primary Key</text>
    <text x="125" y="44" fill="#38bdf8" font-size="11" font-weight="700">FK</text>
    <text x="148" y="44" fill="#cbd5e1" font-size="11">Foreign Key</text>
    <text x="230" y="44" fill="#a78bfa" font-size="11" font-weight="700">UQ</text>
    <text x="255" y="44" fill="#cbd5e1" font-size="11">Unique</text>
    <rect x="14" y="57" width="10" height="10" rx="2" fill="#1e3a8a" />
    <text x="30" y="66" fill="#cbd5e1" font-size="11">Exam Content</text>
    <rect x="135" y="57" width="10" height="10" rx="2" fill="#0f766e" />
    <text x="151" y="66" fill="#cbd5e1" font-size="11">Client Progress (X-Client-Id)</text>
  </g>
</svg>
