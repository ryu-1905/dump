    <text x="14" y="335" fill="#64748b" font-size="11">ENUM: single_choice | multiple_choice | hotspot | drag_drop | simulation</text>
    <text x="14" y="355" fill="#64748b" font-size="11">IDX: (exam_id, topic_id, question_index) + Partial (case_study_id IS NOT NULL)</text>
